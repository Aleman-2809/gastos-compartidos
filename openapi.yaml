openapi: 3.0.3
info:
  title: Gastos compartidos
  version: 0.3.0
  description: >
    API de la aplicación. Con Firebase Auth configurado, la identidad es la cookie de sesión `sesion`
    (HttpOnly, Secure, SameSite=Strict) que se obtiene con `POST /api/sesion`. Sin Firebase (desarrollo y
    pruebas) la identidad es una cookie anónima `uid`. Todas las peticiones que modifican datos exigen el
    encabezado `Origin` del mismo sitio (403 si falta o es ajeno). Un usuario que no es miembro de un grupo
    recibe 404.
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    sesion:
      type: apiKey
      in: cookie
      name: sesion
      description: Cookie de sesión de Firebase Auth (HttpOnly).
    uid:
      type: apiKey
      in: cookie
      name: uid
      description: Identidad anónima de desarrollo (solo cuando Firebase no está configurado).
  schemas:
    Error:
      type: object
      properties: { error: { type: string } }
    Grupo:
      type: object
      properties:
        id: { type: string }
        nombre: { type: string }
        codigo: { type: string, example: ABC234 }
        miembros: { type: object, additionalProperties: { type: string } }
        roles: { type: object, additionalProperties: { type: string, enum: [admin, miembro] } }
        gastos: { type: array, items: { $ref: "#/components/schemas/Gasto" } }
        pagos: { type: array, items: { $ref: "#/components/schemas/Pago" } }
    Gasto:
      type: object
      required: [descripcion, montoCentavos, pagadorUid, participantes]
      properties:
        id: { type: string }
        descripcion: { type: string, maxLength: 80 }
        montoCentavos: { type: integer, minimum: 1 }
        pagadorUid: { type: string }
        participantes: { type: array, minItems: 1, items: { type: string } }
        porcentajes:
          type: object
          description: Opcional. Debe sumar 100 y tener los mismos participantes.
          additionalProperties: { type: number }
    Pago:
      type: object
      required: [deUid, aUid, montoCentavos]
      properties:
        id: { type: string }
        deUid: { type: string }
        aUid: { type: string }
        montoCentavos: { type: integer, minimum: 1 }
security:
  - sesion: []
  - uid: []
paths:
  /api/sesion:
    post:
      summary: Cambia un idToken de Firebase Auth por la cookie de sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties: { idToken: { type: string } }
      responses:
        "200": { description: Sesión creada (cookie `sesion`) }
        "401": { description: Token inválido o inicio de sesión no reciente }
        "403": { description: Origin ausente o de otro sitio }
        "422": { description: Datos inválidos }
        "501": { description: Firebase Auth no está configurado }
    delete:
      summary: Cierra la sesión (borra la cookie)
      security: []
      responses:
        "200": { description: Sesión cerrada }
        "403": { description: Origin ausente o de otro sitio }
  /api/grupos:
    get:
      summary: Lista los grupos del usuario
      responses:
        "200": { description: Lista de grupos (id, nombre, codigo) }
        "401":
          {
            description: Sin sesión,
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
    post:
      summary: Crea un grupo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, tuNombre]
              properties: { nombre: { type: string }, tuNombre: { type: string } }
      responses:
        "201":
          {
            description: Grupo creado,
            content: { application/json: { schema: { $ref: "#/components/schemas/Grupo" } } },
          }
        "400": { description: El cuerpo no es JSON }
        "403": { description: Origin ausente o de otro sitio }
        "422": { description: Datos inválidos }
  /api/grupos/unirse:
    post:
      summary: Une al usuario a un grupo con su código
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, tuNombre]
              properties:
                { codigo: { type: string, minLength: 6, maxLength: 6 }, tuNombre: { type: string } }
      responses:
        "200":
          {
            description: Grupo,
            content: { application/json: { schema: { $ref: "#/components/schemas/Grupo" } } },
          }
        "403": { description: Origin ausente o de otro sitio }
        "404": { description: No existe un grupo con ese código }
        "422": { description: Datos inválidos }
  /api/grupos/{id}/gastos:
    post:
      summary: Registra un gasto (partes iguales o porcentajes)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Gasto" } } }
      responses:
        "201": { description: Gasto registrado }
        "403": { description: Origin ausente o de otro sitio }
        "404": { description: Grupo no encontrado o el usuario no es miembro }
        "422": { description: Datos inválidos o personas que no son del grupo }
  /api/grupos/{id}/pagos:
    post:
      summary: Registra un pago entre dos miembros (solo quien paga, quien recibe o un administrador del grupo)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Pago" } } }
      responses:
        "201": { description: Pago registrado }
        "403":
          {
            description: Origin ausente o de otro sitio,
            o el usuario no es quien paga,
            quien recibe ni administrador,
          }
        "404": { description: Grupo no encontrado o el usuario no es miembro }
        "422": { description: Datos inválidos }
  /api/grupos/{id}/exportar:
    get:
      summary: Exporta gastos y pagos del grupo en CSV
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Archivo CSV, content: { text/csv: { schema: { type: string } } } }
        "404": { description: Grupo no encontrado o el usuario no es miembro }
